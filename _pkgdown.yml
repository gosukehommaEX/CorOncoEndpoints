url: https://gosukehommaEX.github.io/CorOncoEndpoints/
template:
  bootstrap: 5
  bootswatch: cosmo
  theme: arrow-light

home:
  title: CorOncoEndpoints • Generate Correlated Oncology Endpoints
  description: >
    Generates correlated progression-free survival, overall survival and
    objective response for oncology clinical trial simulations.

navbar:
  structure:
    left:  [home, intro, reference, articles, tutorials, news]
    right: [search, github]
  components:
    home:
      icon: fas fa-home fa-lg
      href: index.html
    intro:
      text: Get started
      href: articles/introduction.html
    reference:
      text: Reference
      href: reference/index.html
    articles:
      text: Articles
      menu:
      - text: Getting started with CorOncoEndpoints
        href: articles/introduction.html
      - text: Model and theory
        href: articles/theory.html
      - text: Number of events for PFS and OS
        href: articles/design.html
    news:
      text: Changelog
      href: news/index.html
    github:
      icon: fab fa-github fa-lg
      href: https://github.com/gosukehommaEX/CorOncoEndpoints

reference:
  - title: "Treatment groups"
    desc: >
      Define a treatment group and calibrate the generator
    contents:
      - OncoArm
      - print.OncoArm
  - title: "Data generation"
    desc: >
      Generate patient-level data and data at analysis cutoffs
    contents:
      - rOncoEndpoints
      - CutoffData
      - EventTime
  - title: "Properties of a group"
    desc: >
      Implied correlations, survival functions and quantiles
    contents:
      - CorEndpoints
      - SurvEndpoint
      - QuantileEndpoint
      - CorBoundPFSResponse
  - title: "Trial design"
    desc: >
      Expected events, average hazard ratio and required events
    contents:
      - ExpectedEvents
      - AverageHR
      - RequiredEvents

articles:
- title: Getting Started
  navbar: ~
  contents:
  - introduction
- title: Model and design
  navbar: ~
  contents:
  - theory
  - design

footer:
  structure:
    left: developed_by
    right: built_with
  components:
    developed_by: "Developed by Gosuke Homma"
    built_with: "Built with [pkgdown](https://pkgdown.r-lib.org/)."
